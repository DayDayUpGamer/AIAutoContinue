<!doctype html><html><head><meta charset="utf-8"><title>AI Auto Continue Simulator</title><style>body{font:15px system-ui;max-width:780px;margin:30px auto;background:#f4f6fa}.chat{background:white;border:1px solid #ccd3df;border-radius:12px;padding:18px}.message{padding:10px;margin:8px 0;border-radius:8px}.user{background:#dbeafe}.assistant{background:#eef2f7}.composer{display:flex;gap:8px;margin-top:16px}textarea{flex:1;min-height:70px}button{padding:8px 12px}.toolbar{display:flex;gap:8px;margin-bottom:14px}</style></head><body><h1>AI Auto Continue Local Simulator</h1><p>Development fixture only. Production builds run exclusively on official supported AI domains.</p><div class="toolbar"><button id="native-toggle">Show native continue</button><button id="error-toggle">Show rate-limit alert</button><button id="reset">Reset</button></div><div class="chat"><div id="messages"><div class="message user" data-role="user">Create a long plan.</div><div class="message assistant" data-role="assistant">Part 1 is complete.</div></div><div id="native-slot"></div><div class="composer"><textarea role="textbox" placeholder="Message"></textarea><button type="submit" aria-label="Send">Send</button><button id="stop" aria-label="Stop" hidden>Stop</button></div></div><div id="alerts"></div><script>
const messages=document.querySelector('#messages'),box=document.querySelector('textarea'),send=document.querySelector('[aria-label=Send]'),stop=document.querySelector('#stop'),nativeSlot=document.querySelector('#native-slot');let timer=null;
function generate(prefix='Continuing'){stop.hidden=false;send.disabled=true;let i=0;const msg=document.createElement('div');msg.className='message assistant';msg.dataset.role='assistant';msg.textContent=prefix;messages.append(msg);timer=setInterval(()=>{i++;msg.textContent+=` chunk-${i}`;if(i===5){clearInterval(timer);timer=null;stop.hidden=true;send.disabled=false;}},300);}
send.onclick=()=>{if(!box.value.trim())return;const u=document.createElement('div');u.className='message user';u.dataset.role='user';u.textContent=box.value;messages.append(u);box.value='';box.dispatchEvent(new Event('input',{bubbles:true}));generate('New answer');};
stop.onclick=()=>{if(timer)clearInterval(timer);timer=null;stop.hidden=true;send.disabled=false;};
document.querySelector('#native-toggle').onclick=()=>{nativeSlot.innerHTML='<button aria-label="Continue generating">Continue generating</button>';nativeSlot.firstChild.onclick=()=>{nativeSlot.innerHTML='';generate('Resumed answer');};};
document.querySelector('#error-toggle').onclick=()=>{document.querySelector('#alerts').innerHTML='<div role="alert">Too many requests. Try again later.</div>';};
document.querySelector('#reset').onclick=()=>location.reload();
</script></body></html>
