name: Feature request
description: Propose a focused improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety / privacy impact
      description: Does this change permissions, supported websites, data handling, or automated actions?
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This request does not depend on bypassing login, CAPTCHA, rate limits, quotas, or AI safety controls.
          required: true
